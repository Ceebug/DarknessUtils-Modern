name: Build

on:
  push:
    branches:
      - main
      - port-26.3-build
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: DarknessUtils-MC26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
