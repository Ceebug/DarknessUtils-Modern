plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "v${project.mod_version}+${project.minecraft_version}-fabric"
group = project.group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Separate optional mods; do not bundle either dependency into the output JAR.
    implementation "maven.modrinth:yacl:${project.yacl_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

def modVersion = project.version.toString()
def modMinecraftVersion = project.minecraft_version.toString()
def modLoaderVersion = project.loader_version.toString()

processResources {
    inputs.property "version", modVersion
    inputs.property "minecraft_version", modMinecraftVersion
    inputs.property "loader_version", modLoaderVersion

    filesMatching("fabric.mod.json") {
        expand(
            "version": modVersion,
            "minecraft_version": modMinecraftVersion,
            "loader_version": modLoaderVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    archiveFileName = "DarknessUtils_${project.version}.jar"

    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
